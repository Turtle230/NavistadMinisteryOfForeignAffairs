<!DOCTYPE html>
<html lang="en">

  <title>NFA - Home</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <img id="emblem" src="assets/emblem.png" alt="Navistad emblem">
    <div class="divider"></div>
    <div class="org">
      <strong>Navistadi Ministry of Foreign Affairs</strong>
      <strong>Ministerium Rerum Externarum Navistadense</strong>
    </div>
  </header>

  <nav class="main-nav">
    <a href="index.html" class="active">Home</a>
    <a href="webpages/my-forms.html">My Forms</a>

  <main>
    <h1>Welcome to Navistadi Ministry of Foreign Affairs </h1>

    <div class="service-list">
      <button class="service" data-panel="p1">
        <svg viewBox="0 0 24 24"><path d="M16 11a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm-8 0a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0c-.3 0-.6 0-1 .1 1.2.8 2 1.9 2 3.4V19h6v-2.5c0-2.3-4.700-3.500-7-3.500z"/></svg>

      <div class="service-panel" id="p1">
        <a href="webpages/entry-permission.html">Short-stay visa application</a>
        <a href="webpages/entry-permission.html">Long-stay visa application</a>
      </div>

      <button class="service" data-panel="p4">
        <svg viewBox="0 0 24 24"><path d="M16 11a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm-8 0a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0c-.3 0-.6 0-1 .1 1.2.8 2 1.9 2 3.4V19h6v-2.5c0-2.3-4.700-3.500-7-3.500z"/></svg>
        Applications for Naturalisation
      </button>
      <div class="service-panel" id="p4">
        <a href="webpages/naturalisation.html">Apply for naturalisation</a>
      </div>
      <button class="service" data-panel="p5">
        <svg viewBox="0 0 24 24"><path d="M16 11a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm-8 0a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0c-.3 0-.6 0-1 .1 1.2.8 2 1.9 2 3.4V19h6v-2.5c0-2.3-4.700-3.500-7-3.500z"/></svg>
        Explore the Navistadi Passport
      </button>
      <div class="service-panel" id="p5">
        <a href="webpages/passport.html">Explore the Navistadi Passport</a>
      </div>
